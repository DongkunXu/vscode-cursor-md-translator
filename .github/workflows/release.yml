name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icon
        run: node scripts/generate-icon.js

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension
        run: npm run package

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

      # ── Optional: publish to Open VSX Registry ──────────────────────────
      # Uncomment after creating an account at https://open-vsx.org/
      # and adding OVSX_TOKEN as a repository secret.
      #
      # - name: Publish to Open VSX
      #   run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_TOKEN }}
