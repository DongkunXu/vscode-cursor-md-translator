name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  # Opt into Node.js 24 for action runtimes (required as of May 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # LTS, supported until April 2027
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icon
        run: node scripts/generate-icon.js

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension
        run: ./node_modules/.bin/vsce package --no-dependencies

      - name: Show packaged file
        run: ls -lh *.vsix

      - name: Create GitHub Release and upload VSIX
        run: |
          TAG="${{ github.ref_name }}"
          VSIX=$(ls *.vsix | head -1)
          echo "Tag: $TAG  |  VSIX: $VSIX"

          # Clean up any leftover release from previous failed runs
          gh release delete "$TAG" --yes 2>/dev/null && echo "Deleted existing release" || echo "No prior release found"

          gh release create "$TAG" "$VSIX" \
            --title "Release $TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Optional: publish to Open VSX Registry ──────────────────────────
      # Uncomment after creating an account at https://open-vsx.org/
      # and adding OVSX_TOKEN as a repository secret.
      #
      # - name: Publish to Open VSX
      #   run: npx ovsx publish *.vsix -p ${{ secrets.OVSX_TOKEN }}
